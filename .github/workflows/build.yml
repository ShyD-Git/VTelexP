name: Build RuntimeInspector

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib (arm64)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -target arm64-apple-ios16.0 \
                -isysroot "$SDK" \
                -dynamiclib \
                -install_name @rpath/RuntimeInspector.dylib \
                -framework UIKit \
                -framework Foundation \
                -framework CoreGraphics \
                -O2 \
                -Wall \
                -o RuntimeInspector.dylib \
                RuntimeInspector.m

      - name: Ad-hoc codesign
        run: codesign --force --sign - RuntimeInspector.dylib

      - name: Inspect
        run: |
          file RuntimeInspector.dylib
          echo "--- otool -L ---"
          otool -L RuntimeInspector.dylib
          echo "--- lipo -info ---"
          lipo -info RuntimeInspector.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuntimeInspector
          path: RuntimeInspector.dylib
          if-no-files-found: error
          retention-days: 3
