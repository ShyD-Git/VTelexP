name: Build RuntimeInspector

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib (arm64)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -target arm64-apple-ios16.0 \
                -isysroot "$SDK" \
                -dynamiclib \
                -install_name @rpath/TestInject.dylib \
                -framework UIKit \
                -framework Foundation \
                -O2 \
                -fobjc-arc \
                -o TestInject.dylib \
                RuntimeInspector.m

      - name: Ad-hoc codesign
        run: codesign --force --sign - TestInject.dylib

      - name: Tạo Release và Upload file thô
        uses: softprops/action-gh-release@v2
        with:
          files: TestInject.dylib
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
